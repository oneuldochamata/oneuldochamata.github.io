<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4ede1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘도 참았다">
<meta name="description" content="오늘도 참았다 — 결재 반려하기 · 업무 파쇄기 · 사직서 던지기. 폰을 휘둘러 회사 스트레스를 날리는 브릭 스타일 게임.">
<title>오늘도 참았다</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4ede1; --ink:#2b2a33; --ink2:#6b6573; --paper:#fffdf7; --line:#e6dccb;
  --red:#e3412f; --blue:#2f6fd6; --yellow:#f6c026; --green:#38a85a; --orange:#f28c28; --purple:#7a5cd6;
  --wood:#b57a4a; --wood2:#94603a; --stamp:#d8262a;
  --lv0:#ece4d6; --lv1:#5cbf73; --lv2:#f6c026; --lv3:#f28c28; --lv4:#e3412f;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-family:'Gowun Dodum',system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;margin:0}

/* ---------- brick primitives ---------- */
.brick{--c:var(--red);position:relative;background:var(--c);border-radius:14px;
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25),0 5px 0 rgba(0,0,0,.08)}
.brick::before{content:"";position:absolute;top:-8px;left:18px;right:18px;height:9px;border-radius:5px 5px 0 0;
  background:repeating-linear-gradient(90deg,var(--c) 0 18px,transparent 18px 30px);
  filter:brightness(1.06)}
.brick.nostud::before{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Jua',sans-serif;font-size:18px;
  padding:14px 18px 17px;color:#fff;border-radius:14px;transition:transform .08s}
.btn:active{transform:translateY(3px)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 -5px 0 #e6dccb,0 3px 0 rgba(0,0,0,.06)}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;
  box-shadow:inset 0 -4px 0 #e6dccb}
.icon-btn:active{transform:translateY(2px)}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- lobby ---------- */
#lobby{overflow-y:auto;padding:calc(18px + var(--safe-t)) 16px calc(24px + var(--safe-b));gap:16px;
  background:radial-gradient(circle at 20% 0%,#fff6e4 0,transparent 50%),var(--bg)}
.lobby-head{position:relative;text-align:center;padding-top:6px}
.lobby-head .settings-btn{position:absolute;right:0;top:0}
.lobby-head h1{margin:0}
/* ---------- 로고: 오늘도 참았다 ---------- */
.logo{--w:min(80px,21vw);display:inline-flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.logo-top{font-family:'Gaegu',cursive;font-weight:700;font-size:min(30px,8.4vw);color:var(--ink);transform:rotate(-5deg) translateX(-28%);
  display:inline-flex;align-items:center;gap:4px;line-height:1;letter-spacing:0}
.logo-top .dots{color:var(--ink2);letter-spacing:0}
.logo-keys{display:flex;gap:min(8px,2vw);padding-top:8px}
.kc{--c:#e3412f;--d:#b52c1e;--t:#f26a57;position:relative;width:var(--w);height:calc(var(--w)*.94);border-radius:calc(var(--w)*.2);
  background:linear-gradient(180deg,var(--c),var(--d));display:grid;place-items:center;transform:translateY(var(--dy,0)) rotate(var(--r,0));
  box-shadow:0 calc(var(--w)*.08) 0 rgba(0,0,0,.28),0 calc(var(--w)*.12) 8px rgba(0,0,0,.12)}
.kc .top{position:absolute;left:11%;right:11%;top:6%;bottom:18%;border-radius:calc(var(--w)*.15);
  background:radial-gradient(120% 95% at 50% 30%,var(--t),var(--c) 72%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.08)}
.kc b{position:relative;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:calc(var(--w)*.5);color:#fff;line-height:1;margin-top:-12%;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.kc.y{--c:#f6c026;--d:#cf9a0c;--t:#ffdc63}.kc.y b{color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4)}
.kc.b{--c:#2f6fd6;--d:#1f4fa6;--t:#5a90ec}
.kc .crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.anger{position:absolute;right:calc(var(--w)*-.4);top:-8px;width:calc(var(--w)*.46);height:calc(var(--w)*.46);animation:angry 1.1s ease-in-out infinite}
@keyframes angry{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(8deg)}}
.lobby-head p{margin:6px 0 0;color:var(--ink2);font-size:15px}
.today-chip{align-self:center;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:inset 0 -3px 0 #e6dccb;display:flex;gap:8px;align-items:center}
.today-chip b{font-family:'Jua';font-weight:400}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block}
.room-list{display:flex;flex-direction:column;gap:22px;margin-top:10px;max-width:520px;width:100%;align-self:center}
.room-card{display:flex;align-items:center;gap:14px;padding:14px 14px 19px;border-radius:22px;text-align:left;color:#fff;width:100%;transition:transform .08s}
.room-card:active{transform:translateY(3px)}
.rc-icon{flex:0 0 80px;height:80px;border-radius:20px;background:rgba(255,255,255,.96);display:grid;place-items:center;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.rc-icon svg{width:70px;height:70px;overflow:visible}
.room-card:active .rc-icon svg{animation:wiggle .3s}
@keyframes wiggle{30%{transform:rotate(-6deg) scale(1.05)}70%{transform:rotate(5deg)}}
.rc-text h2{font-size:22px}
.rc-text p{margin:3px 0 6px;font-size:14px;opacity:.95}
.rc-how{display:inline-block;font-size:12px;background:rgba(0,0,0,.18);border-radius:999px;padding:3px 9px}
#calBtn{max-width:520px;width:100%;align-self:center;margin-top:12px}
.foot{text-align:center;color:var(--ink2);font-size:12px;margin:0}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(43,42,51,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.show{display:flex;animation:fadeIn .18s}
.modal{background:var(--paper);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + var(--safe-b));
  max-height:92vh;overflow-y:auto;animation:sheetUp .25s cubic-bezier(.2,.9,.3,1.2)}
.modal h3{font-size:24px;margin-bottom:6px}
.modal .lead{margin:0 0 14px;color:var(--ink2);line-height:1.5}
.how{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.how li{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:inset 0 -3px 0 var(--line);display:flex;gap:10px;align-items:center;line-height:1.35}
.how li span:first-child{font-size:22px}
.field{display:block;margin:0 0 14px}
.field>span,.field-head>span{display:block;font-family:'Jua';font-size:15px;margin-bottom:6px}
.field>span em{font-style:normal;color:var(--ink2);font-family:'Gowun Dodum';font-size:12px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.field-head>span{margin:0}
.reset-btn{font-family:'Jua';font-size:13px;color:var(--red);background:#fff;border-radius:999px;padding:5px 11px;box-shadow:inset 0 -2px 0 var(--line)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.add-btn{flex:0 0 auto;font-family:'Jua';font-size:15px;color:#fff;background:var(--ink);border-radius:12px;padding:0 16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.chips{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips li{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;box-shadow:inset 0 -2px 0 var(--line);max-width:100%}
.chips li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips li button{width:22px;height:22px;border-radius:50%;background:var(--bg);font-size:11px;flex:0 0 auto}
.real{display:inline-block;font-family:'Jua';font-weight:400;font-size:11px;color:#fff;background:var(--stamp);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:3px;letter-spacing:0}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;outline:none}
.field input:focus{border-color:var(--ink)}
.field small{display:block;color:var(--ink2);margin-top:5px;font-size:12px}
.safety{background:#fff4d6;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:14px}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px;box-shadow:inset 0 -3px 0 var(--line)}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-family:'Jua'}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- game shell ---------- */
#game{background:var(--bg)}
.g-top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;position:relative;z-index:5}
.g-title{flex:1;font-family:'Jua';font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff;border-radius:999px;padding:6px 11px;font-family:'Jua';font-size:16px;box-shadow:inset 0 -3px 0 var(--line);white-space:nowrap}
.pill.timer{min-width:58px;text-align:center}
.pill.timer.hurry{background:var(--red);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.g-progress{height:6px;background:#e6dccb;margin:0 12px;border-radius:3px;overflow:hidden}
.g-progress i{display:block;height:100%;background:var(--ink);width:100%;transform-origin:left;transition:transform .2s linear}
.g-stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.g-hint{display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + var(--safe-b));background:#fff;font-size:14px;line-height:1.3;
  box-shadow:0 -3px 0 var(--line);position:relative;z-index:5}
.g-hint #gHintIcon{font-size:22px}
.g-hint #gHintText{flex:1}
.meter{width:54px;height:10px;border-radius:5px;background:#eee4d4;overflow:hidden;flex:0 0 auto}
.meter i{display:block;height:100%;width:0;background:var(--green);border-radius:5px;transition:width .06s}
.g-overlay{position:absolute;inset:0;display:none;place-items:center;z-index:20;pointer-events:none}
.g-overlay.show{display:grid}
.g-overlay .big{font-family:'Jua';font-size:88px;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);animation:popIn .5s}
.g-overlay .endmark{font-family:'Jua';font-size:64px;color:var(--stamp);border:8px double var(--stamp);border-radius:18px;padding:6px 28px;background:rgba(255,255,255,.85);transform:rotate(-10deg);animation:stampIn .25s ease-out}
.combo{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-family:'Jua';font-size:28px;color:var(--orange);
  -webkit-text-stroke:1.5px #fff;pointer-events:none;z-index:15;opacity:0;white-space:nowrap}
.combo.show{animation:comboPop .7s ease-out}
#game.shake{animation:shake .35s}
#game.shake-s{animation:shakeS .2s}

/* ---------- brick character ---------- */
.fig{position:relative;width:84px;height:116px;transform-origin:bottom center}
.fig-hair{position:absolute;left:12px;top:0;width:60px;height:20px;background:#3b2f2a;border-radius:14px 14px 5px 5px;z-index:2}
.fig-head{position:absolute;left:16px;top:8px;width:52px;height:46px;background:#ffd6ad;border-radius:12px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.fig .eye{position:absolute;top:21px;width:6px;height:8px;background:var(--ink);border-radius:3px;transition:all .1s}
.fig .eye.l{left:13px}.fig .eye.r{right:13px}
.fig .brow{position:absolute;top:15px;width:11px;height:3px;background:var(--ink);border-radius:2px}
.fig .brow.l{left:10px;transform:rotate(12deg)}.fig .brow.r{right:10px;transform:rotate(-12deg)}
.fig .mouth{position:absolute;left:50%;bottom:8px;width:14px;height:4px;margin-left:-7px;background:var(--ink);border-radius:2px;transition:all .1s}
.fig .sweat{position:absolute;right:-7px;top:4px;width:9px;height:12px;background:#7cc6ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0}
.fig-body{position:absolute;left:6px;top:54px;width:72px;height:58px;background:#3d4b6b;border-radius:14px 14px 6px 6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);overflow:hidden}
.fig-body::before{content:"";position:absolute;left:50%;top:0;margin-left:-14px;border:14px solid transparent;border-top:20px solid #fff;border-bottom:0}
.fig-body i{position:absolute;left:50%;top:6px;width:8px;height:30px;margin-left:-4px;background:var(--red);border-radius:2px 2px 4px 4px}
.fig.shock .eye{width:9px;height:11px;border-radius:50%;top:19px}
.fig.shock .mouth{width:11px;height:11px;border-radius:50%;margin-left:-5.5px;bottom:5px}
.fig.shock .sweat{opacity:1;animation:drip .6s ease-in}
.fig.sad .mouth{height:6px;border-radius:7px 7px 0 0;background:transparent;border:3px solid var(--ink);border-bottom:0}
.fig.sad .brow.l{transform:rotate(-14deg)}.fig.sad .brow.r{transform:rotate(14deg)}
.fig.jump{animation:jump .5s}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:7px 12px;font-size:14px;
  white-space:nowrap;box-shadow:0 3px 0 var(--line);opacity:0;margin-bottom:6px;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.show{animation:bubble 1.3s ease-out}
.nameplate{background:#2b2a33;color:#ffe9a8;font-family:'Jua';font-size:13px;padding:4px 10px 6px;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);white-space:nowrap}

/* ---------- room 1: 결재 반려하기 ---------- */
.r1{position:absolute;inset:0;background:
  linear-gradient(transparent 31%,var(--wood) 31%,var(--wood) 36%,var(--wood2) 36%,var(--wood2) 37.5%,transparent 37.5%),
  repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.035) 23px 25px),#efe5d3}
.r1 .win{position:absolute;top:4%;left:6%;width:26%;height:20%;background:linear-gradient(#bfe3f7,#e3f4fb);border:6px solid #fff;border-radius:8px;box-shadow:0 3px 0 var(--line)}
.r1 .clock{position:absolute;top:5%;right:8%;width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid var(--ink);box-shadow:0 3px 0 var(--line)}
.r1 .clock::before,.r1 .clock::after{content:"";position:absolute;left:50%;top:50%;width:3px;background:var(--ink);transform-origin:bottom;border-radius:2px}
.r1 .clock::before{height:13px;margin:-13px 0 0 -1.5px;transform:rotate(180deg)}
.r1 .clock::after{height:16px;margin:-16px 0 0 -1.5px;animation:spin 3s linear infinite}
.r1 .boss-wrap{position:absolute;left:50%;top:31%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.r1 .boss-wrap .nameplate{position:absolute;top:100%;margin-top:6px;z-index:2}
.doc-slot{position:absolute;left:50%;top:41%;bottom:10px;width:min(78%,310px);transform:translateX(-50%)}
.doc{position:absolute;inset:0;background:var(--paper);border-radius:6px;padding:14px 14px 10px;box-shadow:0 8px 0 rgba(0,0,0,.08),0 1px 0 var(--line);
  display:flex;flex-direction:column;gap:8px;overflow:hidden;cursor:pointer}
.doc.enter{animation:docIn .3s cubic-bezier(.2,.9,.3,1.15)}
.doc.out{animation:docOut .34s ease-in forwards}
.doc.hit{animation:docHit .2s}
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.doc-head h4{font-family:'Jua';font-weight:400;font-size:20px;margin:2px 0 0;letter-spacing:2px}
.sign{border-collapse:collapse;font-size:10px;text-align:center;flex:0 0 auto}
.sign th{border:1.5px solid var(--ink);padding:1px 6px;font-weight:400;background:#f3ecdf}
.sign td{border:1.5px solid var(--ink);height:30px;width:34px;position:relative}
.mini-seal{display:inline-grid;place-items:center;width:24px;height:24px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);font-size:8px;line-height:1;transform:rotate(-8deg)}
.doc-title{font-family:'Jua';font-size:clamp(16px,4.6vw,19px);line-height:1.3;padding:8px 0;border-top:2px solid var(--ink);border-bottom:1px dashed var(--line)}
.doc-meta{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.doc-lines{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:4px;min-height:0;overflow:hidden}
.doc-lines i{display:block;height:7px;border-radius:4px;background:#ece4d6}
.stamp{position:absolute;left:var(--x,50%);top:var(--y,55%);padding:4px 16px;border:6px double var(--stamp);color:var(--stamp);font-family:'Jua';
  font-size:50px;letter-spacing:10px;line-height:1.1;border-radius:12px;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--s));
  opacity:.9;mix-blend-mode:multiply;animation:stampIn .16s ease-out;white-space:nowrap;padding-left:26px}
.ink{position:absolute;border-radius:50%;background:var(--stamp);opacity:.75;mix-blend-mode:multiply;animation:popIn .2s}
.reject-pile{position:absolute;left:8px;bottom:8px;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3;pointer-events:none}
.pile{position:relative;width:64px;height:52px}
.pile .tray{position:absolute;left:0;right:0;bottom:0;height:16px;border-radius:5px;background:var(--red);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.pile .sheet{position:absolute;left:6px;right:6px;height:5px;background:#fff;border-radius:2px;box-shadow:0 1px 0 var(--line)}
.pile-label{font-family:'Jua';font-size:12px;background:#fff;border-radius:999px;padding:2px 8px;box-shadow:inset 0 -2px 0 var(--line);white-space:nowrap}

/* ---------- room 2: 업무 파쇄기 ---------- */
.r2{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.03) 46px 48px),#e9eef5}
.r2 .pile-badge{position:absolute;right:10px;top:8px;z-index:8;pointer-events:none}
.inbox{position:absolute;left:0;right:0;top:0;height:50%}
.task{position:absolute;width:min(46%,180px);padding:9px 10px 11px;background:var(--pc,#fff);border-radius:6px;font-size:13px;line-height:1.35;
  box-shadow:0 4px 0 rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);transform:rotate(var(--r));cursor:grab;touch-action:none}
.task.drop{animation:taskDrop .3s cubic-bezier(.2,.9,.3,1.2)}
.task .tag{display:inline-block;font-family:'Jua';font-size:11px;color:#fff;background:var(--tc,var(--red));border-radius:5px;padding:2px 6px;margin-bottom:4px}
.task p{margin:0}
.shredder{--c:var(--blue);position:absolute;left:50%;top:52%;width:min(86%,340px);height:15%;min-height:78px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px 16px;color:#fff;z-index:6}
.shredder .slot{position:absolute;left:12%;right:12%;top:-5px;height:10px;border-radius:5px;background:#1a1d29;box-shadow:inset 0 3px 0 rgba(0,0,0,.4);z-index:3}
.shredder .label{font-family:'Jua';font-size:16px;line-height:1.1}
.shredder .label small{display:block;font-family:'Gowun Dodum';font-size:11px;opacity:.85}
.leds{display:flex;gap:4px}
.leds i{width:11px;height:20px;border-radius:3px;background:rgba(0,0,0,.25)}
.leds i.on{background:#7dff9a;box-shadow:0 0 8px #7dff9a}
.leds i.on.hot{background:#ffd23f;box-shadow:0 0 8px #ffd23f}
.leds i.on.max{background:#ff5d4a;box-shadow:0 0 10px #ff5d4a}
.turbo{position:absolute;right:10px;top:-34px;font-family:'Jua';font-size:18px;color:var(--red);opacity:0;transition:opacity .15s;-webkit-text-stroke:1px #fff}
.turbo.on{opacity:1;animation:pulse .3s infinite alternate}
.bin{position:absolute;left:50%;bottom:8px;width:min(70%,270px);top:calc(52% + max(15%,78px) + 14px);transform:translateX(-50%);
  border:5px solid rgba(47,111,214,.55);border-top:0;border-radius:0 0 18px 18px;background:rgba(255,255,255,.35);overflow:hidden}
.bin-fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .4s;
  background:repeating-linear-gradient(90deg,#fff 0 5px,#fff3b0 5px 9px,#fff 9px 13px,#cfe2ff 13px 17px,#ffd6e0 17px 21px)}
.bin-fill::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;
  background:radial-gradient(circle at 8px 6px,#fff 5px,transparent 6px) 0 0/16px 12px repeat-x}
.strip{position:absolute;width:5px;height:24px;border-radius:2px;top:0;pointer-events:none;z-index:4}

/* ---------- room 3: 사직서 던지기 ---------- */
.r3{position:absolute;inset:0;background:linear-gradient(#e7e2f3 0,#e7e2f3 46%,#cdbfa8 46%,#c4b49a 100%)}
.r3::before{content:"";position:absolute;left:0;right:0;top:46%;bottom:0;
  background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(0,0,0,.05) 60px 62px)}
.r3 .win{position:absolute;top:5%;right:7%;width:24%;height:18%;background:linear-gradient(#ffd9a8,#ffe9cf);border:6px solid #fff;border-radius:8px}
.r3 .frame{position:absolute;top:7%;left:8%;width:58px;height:42px;background:#fff;border:4px solid var(--wood);border-radius:4px;font-family:'Jua';font-size:10px;display:grid;place-items:center;text-align:center;line-height:1.1;color:var(--ink2)}
.target{position:absolute;left:50%;top:12%;width:min(80%,300px);height:37%;transform:translateX(-50%)}
.chair{position:absolute;left:50%;top:9%;width:108px;height:120px;margin-left:-54px;background:#4b4f63;border-radius:28px 28px 10px 10px;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.14)}
.target .boss-wrap{position:absolute;left:50%;top:2%;transform:translateX(-50%) scale(.8);transform-origin:top center}
.hands{position:absolute;left:50%;top:-5px;width:86px;margin-left:-43px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
.hands i{width:21px;height:12px;border-radius:6px;background:#ffd6ad;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
.monitor{position:absolute;left:3%;top:-40px;width:58px;height:42px;background:#2b2a33;border:4px solid #44434f;border-radius:7px;z-index:1}
.monitor::after{content:"";position:absolute;left:50%;bottom:-12px;width:10px;height:9px;margin-left:-5px;background:#44434f}
.mug{position:absolute;right:6%;top:-16px;width:18px;height:20px;background:#fff;border-radius:3px 3px 6px 6px;z-index:4;box-shadow:inset 0 -3px 0 #e6dccb}
.mug::after{content:"";position:absolute;right:-7px;top:4px;width:7px;height:9px;border:3px solid #fff;border-left:0;border-radius:0 6px 6px 0}
.desk-plate{position:absolute;left:50%;bottom:calc(54% + 4px);transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center}
.desk-plate .nameplate{font-size:14px;padding:5px 12px 7px;border-radius:5px 5px 2px 2px}
.desk-plate::after{content:"";width:calc(100% + 8px);height:5px;background:#5a4632;border-radius:2px}
.desk3{position:absolute;left:0;right:0;bottom:0;height:58%}
.desk-top{position:absolute;left:0;right:0;top:0;height:46%;background:#c98c58;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);z-index:2}
.desk-front{position:absolute;left:0;right:0;top:46%;bottom:0;background:var(--wood2);border-radius:0 0 8px 8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);z-index:2}
.desk3.bump{animation:bump .3s}
.landed{position:absolute;left:0;right:0;top:0;height:46%;z-index:3}
.landed .env{position:absolute;width:30px;height:20px;margin:-10px 0 0 -15px;transform:rotate(var(--r))}
.env{background:#fff;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.15);display:grid;place-items:center;font-family:'Jua';color:var(--ink)}
.landed .env::after{content:"";width:60%;height:3px;background:var(--stamp);border-radius:2px}
.holder{position:absolute;left:50%;bottom:6%;width:min(58%,220px);aspect-ratio:1.55;transform:translateX(-50%);touch-action:none}
.holder .env{position:absolute;inset:0;border-radius:8px;flex-direction:column;box-shadow:0 8px 0 rgba(0,0,0,.12),inset 0 0 0 2px #eee5d6;cursor:grab;
  background:linear-gradient(160deg,#fff 0 60%,#f7f1e6 60%)}
.holder .env b{font-weight:400;font-size:clamp(30px,10vw,40px);letter-spacing:8px;padding-left:8px}
.holder .env small{font-family:'Gowun Dodum';font-size:12px;color:var(--ink2);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.holder .env .seal{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;background:var(--stamp);color:#fff;font-size:11px;display:grid;place-items:center}
.holder .env.rise{animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
.aim{position:absolute;left:50%;bottom:calc(6% + min(58%,220px)/1.55 + 14px);transform:translateX(-50%);font-family:'Jua';font-size:14px;color:var(--ink2);
  animation:bob 1.2s ease-in-out infinite;white-space:nowrap;pointer-events:none}
.pop{position:absolute;font-family:'Jua';pointer-events:none;z-index:12;transform:translate(-50%,-50%);white-space:nowrap;animation:popUp .8s ease-out forwards;-webkit-text-stroke:1.5px #fff}
.flyer{position:absolute;width:16px;height:12px;background:#fff;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.15);z-index:11;pointer-events:none}

/* ---------- result ---------- */
#result{overflow-y:auto;padding:calc(24px + var(--safe-t)) 16px calc(20px + var(--safe-b));gap:16px;align-items:center;
  background:radial-gradient(circle at 50% 0,#fff8ea 0,transparent 60%),var(--bg)}
.res-card{width:100%;max-width:520px;background:var(--paper);border-radius:22px;padding:24px 20px;box-shadow:0 6px 0 var(--line);text-align:center;margin-top:12px}
.res-room{display:inline-block;font-family:'Jua';font-size:14px;color:#fff;border-radius:999px;padding:4px 12px;margin-bottom:14px}
.res-title{font-size:clamp(23px,6.6vw,30px);line-height:1.35;word-break:keep-all}
.res-title b{font-weight:400;color:var(--lvc,var(--red));font-size:1.25em}
.res-bricks{display:flex;gap:5px;justify-content:center;margin:20px 0 6px;flex-wrap:nowrap}
.res-bricks i{flex:1;max-width:30px;height:22px;border-radius:5px;background:var(--lv0);position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.res-bricks i.on{background:var(--lvc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);animation:popIn .25s backwards}
.res-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);max-width:340px;margin:0 auto}
.res-stat{font-family:'Jua';font-size:16px;margin:18px 0 0;padding:10px 12px;background:#f6f0e4;border-radius:12px}
.res-comfort{line-height:1.75;margin:16px 0 0;font-size:16px;word-break:keep-all}
.res-actions{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.res-actions .wide{grid-column:1/-1}

/* ---------- calendar ---------- */
#calendar{overflow-y:auto;padding:calc(10px + var(--safe-t)) 16px calc(20px + var(--safe-b));gap:14px;align-items:center}
.cal-wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.cal-top{display:flex;align-items:center;gap:10px}
.cal-top h2{flex:1;font-size:22px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:6px;box-shadow:inset 0 -4px 0 var(--line)}
.cal-nav h3{font-size:20px}
.cal-nav button{width:40px;height:36px;border-radius:10px;font-size:18px}
.cal-nav button:active{background:var(--bg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .wd{text-align:center;font-family:'Jua';font-size:13px;color:var(--ink2);padding-bottom:2px}
.cal-grid .wd:first-child{color:var(--red)}.cal-grid .wd:last-child{color:var(--blue)}
.cell{aspect-ratio:.8;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 6px;
  font-size:12px;box-shadow:inset 0 -3px 0 var(--line);position:relative}
.cell.empty{background:transparent;box-shadow:none}
.cell.today{outline:2.5px solid var(--ink);outline-offset:-2px}
.cell.sel{transform:translateY(-2px);box-shadow:inset 0 -3px 0 var(--line),0 4px 0 rgba(0,0,0,.12)}
.cell .n{font-family:'Jua'}
.cell .b{--bc:var(--lv1);width:84%;flex:0 0 auto;height:44%;max-height:30px;border-radius:6px;display:grid;place-items:center;font-family:'Jua';font-size:clamp(9px,2.8vw,12px);color:#fff;
  background:var(--bc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);position:relative}
.cell .b::before{content:"";position:absolute;top:-3px;left:16%;right:16%;height:4px;border-radius:2px 2px 0 0;
  background:linear-gradient(90deg,var(--bc) 0 30%,transparent 30% 70%,var(--bc) 70% 100%)}
.cell .b.lv2{--bc:var(--lv2);color:var(--ink)}.cell .b.lv3{--bc:var(--lv3)}.cell .b.lv4{--bc:var(--lv4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal-sum{background:#fff;border-radius:14px;padding:14px;box-shadow:inset 0 -4px 0 var(--line);line-height:1.6;font-size:14px}
.cal-sum h4{font-family:'Jua';font-weight:400;font-size:17px;margin:0 0 6px}
.cal-sum ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.cal-sum li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px}
.cal-sum li .t{color:var(--ink2);font-size:12px;width:40px}
.cal-sum li .r{flex:1}
.cal-sum li b{font-family:'Jua';font-weight:400}

/* ---------- keyframes ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes popIn{from{transform:scale(0);opacity:0}}
@keyframes stampIn{from{transform:translate(-50%,-50%) rotate(var(--r,-10deg)) scale(calc(var(--s,1)*2.6));opacity:0}}
@keyframes docIn{from{transform:translateY(-55%) scale(.55);opacity:0}}
@keyframes docOut{to{transform:translate(-95%,55%) rotate(-28deg) scale(.25);opacity:0}}
@keyframes docHit{30%{transform:scale(.96) translateY(4px)}}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.4)}25%{opacity:1;transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(1)}}
@keyframes shake{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}
@keyframes shakeS{33%{transform:translate(-3px,2px)}66%{transform:translate(3px,-2px)}}
@keyframes drip{from{transform:translateY(-6px);opacity:0}}
@keyframes jump{30%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(0) scaleY(.92)}}
@keyframes bubble{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.7)}12%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.12)}}
@keyframes taskDrop{from{transform:translateY(-140px) rotate(var(--r));opacity:0}}
@keyframes bump{40%{transform:translateY(5px) scaleY(.97)}}
@keyframes rise{from{transform:translateY(60%) scale(.8);opacity:0}}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}

/* ================= 재미 요소 ================= */
/* 로고: 떨어지며 등장, 누르면 타닥 */
.logo{cursor:pointer}
.kc{transition:transform .09s ease-out,box-shadow .09s;animation:keyDrop .6s cubic-bezier(.2,1.4,.4,1) backwards}
.kc:nth-child(2){animation-delay:.13s}.kc:nth-child(3){animation-delay:.26s}
.kc.press{transform:translateY(calc(var(--dy,0px) + var(--w)*.07)) rotate(var(--r,0)) scale(.98);box-shadow:0 calc(var(--w)*.01) 0 rgba(0,0,0,.28)}
@keyframes keyDrop{from{transform:translateY(-150px) rotate(var(--r,0));opacity:0}}
@keyframes angry{0%,100%{transform:scale(var(--ang,1))}50%{transform:scale(calc(var(--ang,1)*1.18)) rotate(8deg)}}
.logo-top{animation:mutter 2.6s ease-in-out infinite}
@keyframes mutter{0%,100%{transform:rotate(-5deg) translateX(-28%)}50%{transform:rotate(-2deg) translateX(-28%) translateY(-2px)}}
/* 전광판 뉴스 */
.ticker{align-self:center;width:100%;max-width:520px;height:38px;flex:0 0 38px;background:#26252e;border-radius:12px;overflow:hidden;display:flex;align-items:stretch;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.45),0 3px 0 rgba(0,0,0,.08)}
.ticker .tag{flex:0 0 auto;background:var(--red);color:#fff;font-family:'Jua';font-size:13px;padding:0 10px;display:grid;place-items:center;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#b52c1e}}
.ticker .track{flex:1;overflow:hidden;position:relative;-webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.ticker .run{position:absolute;left:0;top:50%;white-space:nowrap;font-family:'Jua';font-size:15px;color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.45);
  animation:marquee var(--dur,40s) linear infinite}
.ticker .run b{color:#ff8a7a;font-weight:400}
@keyframes marquee{from{transform:translate(0,-50%)}to{transform:translate(-50%,-50%)}}
/* 카드 등장 + 일러스트 움직임 */
.room-card{animation:cardIn .5s cubic-bezier(.2,1.3,.4,1) backwards}
.room-card:nth-child(2){animation-delay:.08s}.room-card:nth-child(3){animation-delay:.16s}
@keyframes cardIn{from{transform:translateY(34px) scale(.96);opacity:0}}
.room-card:active{transform:translateY(3px) scale(.98)}
.ill-bob{transform-box:fill-box;transform-origin:50% 100%;animation:stampBob 2.2s ease-in-out infinite}
@keyframes stampBob{0%,50%,100%{transform:translateY(0)}32%{transform:translateY(-7px) rotate(-5deg)}58%{transform:translateY(4px) scaleY(.9)}}
.ill-ink{transform-box:fill-box;transform-origin:center;animation:inkPulse 2.2s ease-in-out infinite}
@keyframes inkPulse{0%,54%{opacity:.35;transform:scale(.92)}60%{opacity:1;transform:scale(1.08)}70%,100%{opacity:1;transform:scale(1)}}
.ill-feed{transform-box:fill-box;animation:feed 1.4s ease-in-out infinite}
@keyframes feed{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
.ill-strips{transform-box:fill-box;transform-origin:50% 0;animation:stripsJ .4s steps(2) infinite}
@keyframes stripsJ{50%{transform:scaleY(1.1) translateX(1px)}}
.ill-float{transform-box:fill-box;transform-origin:center;animation:floatE 1.8s ease-in-out infinite}
@keyframes floatE{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4px,-5px) rotate(5deg)}}
.ill-lines{animation:linesF .9s linear infinite}
@keyframes linesF{0%{opacity:.15;transform:translateX(5px)}50%{opacity:1}100%{opacity:.15;transform:translateX(-5px)}}
/* 게임 중 파편 */
.spark{position:absolute;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:13}
/* FEVER */
#game.fever .g-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;mix-blend-mode:multiply;
  background:linear-gradient(120deg,rgba(255,90,90,.22),rgba(255,210,63,.22),rgba(80,200,120,.22),rgba(80,140,255,.22),rgba(180,100,255,.22),rgba(255,90,90,.22));
  background-size:200% 100%;animation:feverBg .9s linear infinite}
@keyframes feverBg{to{background-position:150% 0}}
.fever-banner{position:absolute;left:0;right:0;top:36%;z-index:16;text-align:center;pointer-events:none;font-family:'Jua';font-size:48px;line-height:1.1;color:#fff;
  -webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);animation:feverIn 1.3s ease-out forwards}
.fever-banner small{display:inline-block;font-size:18px;-webkit-text-stroke:0;text-shadow:none;color:var(--ink);background:#ffd23f;padding:3px 14px;border-radius:999px;margin-top:6px}
@keyframes feverIn{0%{transform:translateX(-110%) skewX(-12deg)}18%{transform:translateX(0) skewX(-12deg)}80%{transform:translateX(0) skewX(-12deg);opacity:1}100%{transform:translateX(110%) skewX(-12deg);opacity:0}}
.pill.fever{background:linear-gradient(90deg,#ff5d4a,#ffb02e);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);animation:pulse .25s infinite alternate}
/* 야근 모드 (마지막 5초) */
#game.hurry .g-stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;animation:hurryPulse .9s ease-in-out infinite}
@keyframes hurryPulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(227,65,47,0)}50%{box-shadow:inset 0 0 70px 14px rgba(227,65,47,.45)}}
.g-overlay .big.go{font-size:66px}
.g-overlay .sub{display:block;font-size:20px;-webkit-text-stroke:0;text-shadow:none;color:var(--ink);text-align:center}
/* 상사가 점점 지침 */
.fig .tear{position:absolute;top:29px;width:5px;height:0;background:#7cc6ff;border-radius:3px;opacity:0}
.fig .tear.l{left:14px}.fig .tear.r{right:14px}
.fig.lv1 .sweat{animation:sweatLoop 1.1s ease-in infinite}
@keyframes sweatLoop{0%{transform:translateY(-4px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
.fig.lv2 .tear{animation:tears .9s ease-in infinite}
@keyframes tears{0%{height:0;opacity:1}70%{height:15px;opacity:1}100%{height:17px;opacity:0}}
.fig.lv2 .fig-hair{transform:rotate(-7deg) translateY(-2px);border-radius:18px 8px 5px 12px}
.fig.lv2 .fig-hair::after{content:"";position:absolute;right:8px;top:-8px;width:11px;height:11px;border:3px solid #3b2f2a;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%}
.fig.lv2:not(.shock) .mouth{width:13px;height:6px;margin-left:-6.5px;border-radius:7px 7px 0 0;background:transparent;border:3px solid var(--ink);border-bottom:0}
/* 결과: 칭호 도장, 꽃가루, 토스트 */
.res-rank{display:inline-block;margin:16px 0 0;font-family:'Jua';font-size:21px;color:var(--rc);border:4px double var(--rc);border-radius:12px;padding:5px 16px;
  transform:rotate(-6deg);background:#fff;visibility:hidden}
.res-rank.show{visibility:visible;animation:rankIn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes rankIn{from{transform:rotate(-6deg) scale(2.6);opacity:0}}
.confetti{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:confFall linear forwards}
@keyframes confFall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-size:14px;z-index:70;
  pointer-events:none;white-space:nowrap;animation:toastA 2.3s ease forwards}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.ticker .run{animation-duration:120s}.ill-bob,.ill-ink,.ill-feed,.ill-strips,.ill-float,.ill-lines,.logo-top{animation:none}}

.vh{position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#game.shake,#game.shake-s{animation:none}}
</style>
</head>
<body>

<!-- ===== 로비 ===== -->
<section id="lobby" class="screen active">
  <header class="lobby-head">
    <h1 id="logoSlot"></h1>
    <p>회사에선 못 하는 것, 여기선 마음껏.</p>
    <button class="icon-btn settings-btn" id="settingsBtn" aria-label="설정">⚙️</button>
  </header>
  <div class="today-chip" id="todayChip"></div>
  <div class="ticker" aria-hidden="true"><span class="tag">속보</span><div class="track"><div class="run" id="tickerRun"></div></div></div>
  <div class="room-list">

<script>
(() => {
'use strict';
/* ================= 유틸 ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const params = new URLSearchParams(location.search);
const DEBUG_DUR = Number(params.get('t')) || 0; // ?t=8 → 8초 테스트

/* ================= 로고 ================= */
const LOGO_HTML = `<span class="logo" role="img" aria-label="오늘도 참았다">
  <span class="logo-top" aria-hidden="true">오늘도<span class="dots">…</span></span>
  <span class="logo-keys" aria-hidden="true">
    <span class="kc" style="--r:-5deg"><i class="top"></i><b>참</b></span>
    <span class="kc y" style="--r:3deg;--dy:-6px"><i class="top"></i><b>았</b></span>
    <span class="kc b" style="--r:-2deg"><i class="top"></i><b>다</b>
      <svg class="crack" viewBox="0 0 100 94" fill="none" stroke="rgba(10,20,60,.55)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><polyline points="98,30 90,38 95,47 87,55 91,66"/><polyline points="95,47 100,50"/></svg>
      <svg class="anger" viewBox="0 0 40 40" fill="none" stroke="#e3412f" stroke-width="5.5" stroke-linecap="round"><path d="M5 15Q15 15 15 5"/><path d="M25 5Q25 15 35 15"/><path d="M35 25Q25 25 25 35"/><path d="M15 35Q15 25 5 25"/></svg>
    </span>
  </span></span>`;
document.getElementById('logoSlot').innerHTML = LOGO_HTML;

/* ================= 저장 ================= */
const KEY = 'oneuldo-chamatda.v1';
const Store = {
  data: { settings: { boss: '', sens: 1, sound: true }, custom: { reject: [], shred: [], resign: [] }, sessions: [] },
  load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d) this.data = { ...this.data, ...d, settings: { ...this.data.settings, ...(d.settings || {}) }, sessions: Array.isArray(d.sessions) ? d.sessions : [] };

    } catch (e) { /* 저장소를 못 쓰는 환경 */ }
  },
  save() { try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* noop */ } },
  get boss() { return (this.data.settings.boss || '').trim() || '김부장'; },
};
Store.load();

/* ================= 익명 이용 통계 (상사 이름·직접 쓴 내용은 절대 보내지 않음) ================= */
const Track = (() => {
  const cfg = window.OC_ANALYTICS || {};
  const isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !params.has('track');
  const on = !!(cfg.url && cfg.key) && !isLocal && navigator.doNotTrack !== '1';
  const rid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  let vid, sid, returning = false;
  try { vid = localStorage.getItem('oc_vid'); returning = !!vid; if (!vid) { vid = rid(); localStorage.setItem('oc_vid', vid); } } catch (e) { vid = rid(); }
  try { sid = sessionStorage.getItem('oc_sid'); if (!sid) { sid = rid(); sessionStorage.setItem('oc_sid', sid); } } catch (e) { sid = rid(); }
  const headers = { apikey: cfg.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' };
  if (cfg.key && !String(cfg.key).startsWith('sb_')) headers.Authorization = `Bearer ${cfg.key}`;

    if (!on) return;
    try {
      fetch(`${String(cfg.url).replace(/\/$/, '')}/rest/v1/events`, { method: 'POST', keepalive: true, headers, body: JSON.stringify({ vid, sid, name, room, value, props }) }).catch(() => {});
    } catch (e) { /* noop */ }
  };

  let active = 0, sent = 0;
  setInterval(() => { if (!document.hidden) { active++; if (active - sent >= 30) { sent = active; ev('hb', null, active); } } }, 1000);
  const leave = () => { if (active > sent) { sent = active; ev('leave', null, active); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) leave(); });
  window.addEventListener('pagehide', leave);
  const pageView = () => {
    const ua = navigator.userAgent;
    const device = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iOS' : /android/i.test(ua) ? 'Android' : /mobile/i.test(ua) ? '기타 모바일' : 'PC';
    const inapp = /Instagram/i.test(ua) ? '인스타그램' : /KAKAOTALK/i.test(ua) ? '카카오톡' : /FBAN|FBAV/i.test(ua) ? '페이스북' : /NAVER\(/i.test(ua) ? '네이버 앱' : /Threads/i.test(ua) ? '스레드' : '';
    let ref = ''; try { ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : ''; } catch (e) { /* noop */ }
    if (ref === location.hostname) ref = '';
    const standalone = window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true;
    ev('page_view', null, null, { device, src: params.get('utm_source') || inapp || ref, standalone: !!standalone, w: screen.width, returning });
  };
  return { ev, pageView, on };
})();

/* ================= 사운드 (Web Audio 합성) ================= */
const Sound = {
  ctx: null, master: null, buf: null, motor: null,
  unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.buf = b;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  get ok() { return !!(this.ctx && Store.data.settings.sound); },
  noise(dur, o = {}) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const s = c.createBufferSource(); s.buffer = this.buf;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.freq || 1000, t); f.Q.value = o.q || 1;
    if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain || 0.4, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  tone(f0, f1, dur, o = {}) {
    if (!this.ok) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain || 0.3, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(this.master); osc.start(t); osc.stop(t + dur + 0.05);
  },
  stamp(i) { this.noise(0.09, { freq: 450, gain: 0.5 + i * 0.4 }); this.tone(120, 42, 0.2, { gain: 0.55 + i * 0.35 }); this.noise(0.04, { type: 'highpass', freq: 3500, gain: 0.12 }); },
  paper() { this.noise(0.28, { type: 'bandpass', freq: 2200, freqEnd: 700, q: 0.7, gain: 0.22, attack: 0.05 }); },
  shred(p) { for (let k = 0; k < 7; k++) this.noise(0.05, { type: 'bandpass', freq: 1500 + Math.random() * 1500, q: 2, gain: 0.25 + p * 0.15, delay: k * 0.045 }); },
  whoosh() { this.noise(0.35, { type: 'bandpass', freq: 400, freqEnd: 2600, q: 1.2, gain: 0.3, attack: 0.08 }); },
  land(tier) {
    if (tier === 3) { this.tone(140, 38, 0.4, { gain: 0.8 }); this.noise(0.3, { freq: 900, gain: 0.7 }); this.noise(0.15, { type: 'highpass', freq: 2500, gain: 0.25, delay: 0.03 }); }
    else if (tier === 2) { this.tone(200, 80, 0.15, { gain: 0.45 }); this.noise(0.08, { freq: 1500, gain: 0.35 }); }
    else { this.noise(0.06, { freq: 1200, gain: 0.25 }); }
  },
  tick() { this.tone(900, 880, 0.06, { type: 'square', gain: 0.08 }); },
  key() { this.noise(0.035, { type: 'highpass', freq: 2500, gain: 0.25 }); this.tone(1700, 1100, 0.04, { type: 'square', gain: 0.05 }); this.tone(160, 90, 0.06, { gain: 0.25 }); },
  boing() { this.tone(260, 900, 0.18, { type: 'triangle', gain: 0.22 }); this.tone(900, 420, 0.2, { type: 'triangle', gain: 0.15, delay: 0.16 }); },
  fever() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, f * 1.01, 0.12, { type: 'square', gain: 0.07, delay: i * 0.055 })); },
  go() { this.tone(660, 1320, 0.25, { type: 'triangle', gain: 0.25 }); },
  end() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.35, { type: 'triangle', gain: 0.18, delay: i * 0.09 })); },
  motorSet(p) {
    if (!this.ok) { this.motorStop(); return; }
    const c = this.ctx;
    if (!this.motor) {
      const o = c.createOscillator(); o.type = 'sawtooth';
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      const g = c.createGain(); g.gain.value = 0;
      o.connect(f).connect(g).connect(this.master); o.start();
      this.motor = { o, f, g };
    }
    const t = c.currentTime;
    this.motor.o.frequency.setTargetAtTime(55 + p * 95, t, 0.05);
    this.motor.f.frequency.setTargetAtTime(400 + p * 1400, t, 0.05);
    this.motor.g.gain.setTargetAtTime(p > 0.03 ? 0.03 + p * 0.09 : 0, t, 0.06);
  },
  motorStop() { if (this.motor) { try { this.motor.o.stop(); } catch (e) { /* noop */ } this.motor = null; } },
};

/* ================= 진동 ================= */
const hapticLabel = $('#hapticLabel');
function haptic(ms = 25) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* noop */ } }
  else hapticLabel.click(); // iOS 18+ Safari: switch 토글 햅틱
}

/* ================= 모션 센서 ================= */
const Motion = {
  enabled: false, receiving: false, mag: 0, rot: 0, listeners: new Set(), grav: null, bound: false,
  async request() {
    if (!('DeviceMotionEvent' in window)) return (this.enabled = false);
    // iOS 는 'granted'/'denied', 최신 크롬은 'prompt' 를 돌려주기도 해서 명시적 거부만 막아요.
    let r = 'granted';
    try {
      if (typeof DeviceMotionEvent.requestPermission === 'function') r = await DeviceMotionEvent.requestPermission();
    } catch (e) { r = 'error'; }
    if (!this.bound) { this.bound = true; window.addEventListener('devicemotion', (e) => this.handle(e)); }
    return (this.enabled = r !== 'denied');
  },
  handle(e) {
    let x, y, z;
    const a = e.acceleration;
    if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
    else {
      const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
      if (!this.grav) this.grav = { x: g.x, y: g.y, z: g.z };
      const k = 0.88; this.grav.x = k * this.grav.x + (1 - k) * g.x; this.grav.y = k * this.grav.y + (1 - k) * g.y; this.grav.z = k * this.grav.z + (1 - k) * g.z;
      x = g.x - this.grav.x; y = g.y - this.grav.y; z = g.z - this.grav.z;
    }
    const r = e.rotationRate || {};
    const mag = Math.hypot(x, y, z), rot = Math.hypot(r.alpha || 0, r.beta || 0, r.gamma || 0);
    if (mag > 0.05 || rot > 0.5) this.receiving = true;
    this.mag = mag; this.rot = rot;
    const s = { x, y, z, mag, rot, t: performance.now() };
    this.listeners.forEach((fn) => fn(s));
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
};
const sensMult = () => [0.7, 1, 1.35][Store.data.settings.sens] ?? 1;
// 짧은 순간의 충격(내려찍기·던지기) 감지기
function peakDetector({ threshold, cooldown, win = 110, onPeak }) {
  let armed = false, peak = 0, peakRot = 0, start = 0, last = -1e9;
  return (s) => {
    const th = threshold * sensMult();
    if (!armed) {
      if (s.mag > th && s.t - last > cooldown) { armed = true; peak = s.mag; peakRot = s.rot; start = s.t; }
      return;

    text = isMine ? pick(mine) : pick(pool);

        const ang = rand(-Math.PI, 0), dist = rand(60, 140);
        f.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist}px) rotate(${rand(-200, 200)}deg)`, opacity: 1, offset: 0.5 },
          { transform: `translate(${Math.cos(ang) * dist * 1.3}px,${Math.sin(ang) * dist + 120}px) rotate(${rand(-400, 400)}deg)`, opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => f.remove();
      }
    } else if (tier === 2) {
      haptic(45); Game.shake(false);
      this.desk.classList.remove('bump'); void this.desk.offsetWidth; this.desk.classList.add('bump');
      if (Math.random() < 0.6) bossReact(this.boss, pick(BOSS_LINES_T), 'shock'); else bossReact(this.boss, null, 'shock');
      pop(this.root, x, y - 30, '착!', 40, 'var(--orange)');
    } else {
      haptic(15);
      bossReact(this.boss, Math.random() < 0.4 ? '…응?' : null, 'sad');
      pop(this.root, x, y - 24, '툭', 30, 'var(--ink2)');
    }
    Game.score(1 + power * 2, `파워 ${pts}`);
  },
  stats(res) { return `사직서 ${res.count}장 투척! 최고 파워 ${res.best}점. 마음속으론 이미 퇴사 완료.`; },
};

const ROOMS = { reject: Reject, shred: Shred, resign: Resign };

/* ================= 화면 전환 ================= */
function show(id) { $$('.screen').forEach((s) => s.classList.toggle('active', s.id === id)); }

/* ----- 로비 ----- */
function dayStats(key) {
  const list = Store.data.sessions.filter((s) => s.day === key);
  return list.length ? { max: Math.max(...list.map((s) => s.stress)), n: list.length, list } : null;
}
const NEWS = ['[속보] {b}, 퇴근 5분 전 회의 소집 예정', '[단독] 오늘 점심 메뉴, 또 {b} 마음대로', '[날씨] 사무실 분노 지수 "매우 높음"… 우산 대신 사직서 지참 요망',
  '[경제] 내 월급, 물가 상승률에 3년 연속 패배', '[사회] "잠깐 얘기 좀" 한마디에 직장인 심박수 급상승', '[스포츠] 금요일 6시 퇴근 100m 달리기, 신기록 기대',
  '[연예] 최종_진짜최종.pptx, 7번째 버전으로 컴백', '[생활] 전문가 "참는 것도 체력… 오늘은 일찍 자야"', '[IT] 단톡방 알림, 퇴근 후에만 3배 증가 확인', '[속보] {b}, "이거 간단한 거야" 발언 또 나와'];
function renderTicker() {
  const mine = [...Store.data.custom.reject, ...Store.data.custom.shred].slice(-3).map((t) => `[제보] ${t}`);
  const items = [...NEWS.map((n) => n.replace('{b}', Store.boss)), ...mine].sort(() => Math.random() - 0.5);
  const sep = '&nbsp;&nbsp;&nbsp;●&nbsp;&nbsp;&nbsp;';
  const one = items.map((t) => esc(t).replace(/^\[(.+?)\]/, '<b>[$1]</b>')).join(sep) + sep;
  const run = $('#tickerRun'); run.innerHTML = one + one;
  run.style.setProperty('--dur', `${Math.max(30, items.join('').length * 0.3)}s`);
}
let angerN = 0;
function bindLogo() {
  const logo = $('#logoSlot .logo'); if (!logo) return;
  const keys = $$('.kc', logo), anger = $('.anger', logo);
  const press = (k) => { k.classList.add('press'); setTimeout(() => k.classList.remove('press'), 120); };
  logo.addEventListener('pointerdown', (e) => {
    Sound.unlock();
    press(e.target.closest('.kc') || pick(keys)); Sound.key(); haptic(8);
    angerN++;
    anger.style.setProperty('--ang', String(Math.min(1.8, 1 + angerN * 0.09)));
    if (angerN >= 10) {
      angerN = 0; anger.style.setProperty('--ang', '1');
      keys.forEach((k, i) => setTimeout(() => { press(k); Sound.key(); }, 120 + i * 110));
      Track.ev('logo_burst');
      Sound.boing(); toast(pick(['…그래도 참았다.', '후우… 오늘도 참았다.', '참을 인(忍) 세 번 완료', '부글부글… 아니야 괜찮아']));
    }
  });
}
function renderLobby() {
  renderTicker();
  const t = dayStats(dayKey());
  const chip = $('#todayChip');
  chip.innerHTML = t
    ? `<i class="dot" style="background:var(--lv${levelOf(t.max)})"></i>오늘의 스트레스 <b>${t.max}%</b> · ${t.n}번 풀었어요`
    : '☕ 오늘은 아직 기록이 없어요';
}

/* ----- 모달 ----- */
const modalBg = $('#modalBg'), modal = $('#modal');
function openModal(html) { modal.innerHTML = html; modalBg.classList.add('show'); }
function closeModal() { modalBg.classList.remove('show'); }
modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });

function openIntro(roomId) {
  const room = ROOMS[roomId]; const it = room.intro();
  const C = Store.data.custom;
  openModal(`<h3>${room.title}</h3><p class="lead">${it.lead}</p>
    <ul class="how">${it.how.map(([i, t]) => `<li><span>${i}</span><span>${t}</span></li>`).join('')}</ul>
    ${room.usesBoss ? `<div class="field"><div class="field-head"><span>상사 이름</span><button class="reset-btn" id="resetBtn">↺ 초기화</button></div>
      <input id="bossInput" maxlength="12" placeholder="예: 김부장" value="${esc(Store.data.settings.boss)}">
      <small>안 쓰면 '김부장'으로 나와요. 초기화를 누르면 상사 이름과 아래에 직접 쓴 내용이 모두 지워져요.</small></div>` : ''}
    <div class="field"><span>✍️ ${room.custom.label} <em>(선택)</em></span>
      <div class="addrow"><input id="customInput" maxlength="40" placeholder="${room.custom.ph}" enterkeyhint="done"><button class="add-btn" id="customAdd">추가</button></div>
      <ul class="chips" id="customList"></ul>
      <small>안 써도 어울리는 내용이 랜덤으로 계속 나와요. 직접 쓴 내용은 그 사이사이 '실제 상황'으로 자주 등장해요.</small></div>
    <div class="safety">⚠️ <b>폰을 꽉 쥐세요!</b> 손목 스트랩이 있으면 더 좋아요. 주변에 사람·물건이 없는지 확인하고, 세게 안 휘둘러도 충분히 인식돼요.</div>
    <div class="modal-actions"><button class="btn ghost" id="introCancel">취소</button><button class="btn brick nostud" id="introGo" style="--c:${room.color}">시작하기</button></div>`);
  const renderChips = () => {
    $('#customList').innerHTML = C[roomId].map((t, i) => `<li><span>${esc(t)}</span><button data-i="${i}" aria-label="삭제">✕</button></li>`).join('');
    $$('#customList button').forEach((b) => (b.onclick = () => { C[roomId].splice(+b.dataset.i, 1); Store.save(); renderChips(); }));
  };
  const add = () => {
    const inp = $('#customInput'); const v = inp.value.trim(); if (!v) return;
    if (!C[roomId].includes(v)) { C[roomId].push(v); if (C[roomId].length > 30) C[roomId].shift(); }
    Store.save(); inp.value = ''; renderChips(); Track.ev('custom_add', roomId);
  };
  renderChips();
  $('#customAdd').onclick = add;
  $('#customInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } });
  if (room.usesBoss) {
    $('#resetBtn').onclick = () => {
      if (!confirm(`상사 이름과 '${room.title}'에 직접 쓴 내용을 모두 지울까요?`)) return;
      Track.ev('reset_click', roomId);
      Store.data.settings.boss = ''; C[roomId] = []; Store.save();
      $('#bossInput').value = ''; renderChips(); renderLobby();
      $('#resetBtn').textContent = '✓ 지웠어요';
    };
  }
  $('#introCancel').onclick = () => { Track.ev('intro_cancel', roomId); closeModal(); };
  $('#introGo').onclick = async () => {
    add();
    if (room.usesBoss) { Store.data.settings.boss = $('#bossInput').value.trim(); Store.save(); }
    Sound.unlock();
    const motionOk = await Motion.request(); // iOS: 반드시 탭 직후에 권한 요청
    Track.ev('motion_perm', roomId, null, { ok: !!motionOk });
    closeModal();
    Game.start(roomId);
  };
}

function openSettings() {
  Track.ev('settings_open');
  const s = Store.data.settings;
  openModal(`<h3>설정</h3>
    <label class="field"><span>상사 이름</span><input id="setBoss" maxlength="12" placeholder="예: 김부장" value="${esc(s.boss)}"></label>
    <div class="field"><span>모션 감도</span><div class="seg" id="setSens">${['예민하게', '보통', '둔하게'].map((l, i) => `<button data-v="${i}" class="${s.sens === i ? 'on' : ''}">${l}</button>`).join('')}</div>
      <small>살짝만 움직여도 인식되면 '둔하게', 세게 해도 안 되면 '예민하게'로 바꿔 보세요.</small></div>
    <div class="field"><span>소리</span><div class="seg" id="setSound"><button data-v="1" class="${s.sound ? 'on' : ''}">켜기</button><button data-v="0" class="${!s.sound ? 'on' : ''}">끄기</button></div></div>
    <div class="modal-actions" style="margin-bottom:12px"><button class="btn ghost" id="setClear" style="font-size:15px">기록 전부 지우기</button></div>

  };
  $('#setDone').onclick = () => { s.boss = $('#setBoss').value.trim(); s.sens = sens; s.sound = sound; Store.save(); closeModal(); renderLobby(); Track.ev('settings_save', null, null, { sens, sound }); };
}

/* ----- 결과 ----- */
let lastRoom = 'reject', lastRes = null;
const RANKS = [{ max: 29, t: '🧘 해탈한 직장인', c: 'var(--green)' }, { max: 59, t: '☕ 평범한 직장인', c: '#c38a00' },
  { max: 84, t: '🔥 폭발 직전', c: 'var(--orange)' }, { max: 100, t: '🌋 퇴사 각성자', c: 'var(--red)' }];
const rankOf = (p) => RANKS.find((r) => p <= r.max);
function confetti(n = 70) {
  const colors = ['#e3412f', '#f6c026', '#2f6fd6', '#38a85a', '#7a5cd6', '#f28c28'];
  for (let i = 0; i < n; i++) {
    const c = el('i', 'confetti'); c.style.left = `${rand(0, 100)}vw`; c.style.background = pick(colors);
    c.style.setProperty('--dx', `${rand(-90, 90)}px`); c.style.setProperty('--rot', `${rand(-720, 720)}deg`);
    c.style.animationDuration = `${rand(1.8, 3.2)}s`; c.style.animationDelay = `${rand(0, 0.5)}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function showResult(res) {
  const room = ROOMS[res.room]; lastRoom = res.room; lastRes = res;
  show('result');
  const rk = $('#resRank'); rk.classList.remove('show');
  $('#shareBtn').style.display = res.count ? '' : 'none';
  const lv = levelOf(res.stress);
  const card = $('.res-card'); card.style.setProperty('--lvc', `var(--lv${lv})`);
  const tag = $('#resRoom'); tag.textContent = room.title; tag.style.background = room.color;
  if (!res.count) {
    $('#resTitle').innerHTML = '오늘의 스트레스는 <b>0%</b>나 되었군요.';
    $('#resStat').textContent = '하나도 안 건드리셨네요.';
    $('#resComfort').textContent = '혹시 득도하셨나요? 아니면 너무 지쳐서 손 하나 까딱하기 싫은 날일 수도 있죠. 그런 날엔 그냥 쉬는 게 정답이에요.';
    $('#resBricks').innerHTML = '<i></i>'.repeat(10);
    return;
  }
  const title = $('#resTitle'); title.innerHTML = '오늘의 스트레스는 <b>0%</b>나 되었군요.';
  const b = $('b', title);
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 900); b.textContent = `${Math.round(res.stress * (1 - Math.pow(1 - k, 3)))}%`; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  const on = Math.max(1, Math.round(res.stress / 10));
  $('#resBricks').innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? 'on' : ''}" style="animation-delay:${i * 70}ms"></i>`).join('');
  const mine = res.mine || [];
  $('#resStat').innerHTML = esc(room.stats(res)) + (mine.length
    ? `<br><small style="font-family:'Gowun Dodum';color:var(--ink2)">직접 쓴 “${esc(mine[0])}”${mine.length > 1 ? ` 외 ${mine.length - 1}건` : ''}도 ${room.doneWord}!</small>` : '');
  const pool = COMFORT.find((c) => res.stress <= c.max).lines;
  $('#resComfort').textContent = pick(pool);
  const r = rankOf(res.stress); rk.textContent = r.t; rk.style.setProperty('--rc', r.c);
  setTimeout(() => {
    if (lastRes !== res) return;
    rk.classList.add('show'); Sound.stamp(0.6); haptic(30);
    if (res.stress >= 60) confetti(); else confetti(28);
  }, 1000);
}
$('#shareBtn').onclick = async () => {
  if (!lastRes) return;
  const room = ROOMS[lastRes.room];
  const text = `오늘의 스트레스 ${lastRes.stress}% (${rankOf(lastRes.stress).t})\n${room.title}에서 ${room.unit} ${lastRes.count}번으로 풀었어요 💢\n#오늘도참았다`;
  const url = location.href.split(/[?#]/)[0];
  Track.ev('share_click', lastRes.room, lastRes.stress, { method: navigator.share ? 'native' : 'clipboard' });
  try { if (navigator.share) { await navigator.share({ title: '오늘도 참았다', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('복사했어요! 붙여넣어 자랑하세요'); } catch (e) { toast('이 브라우저에선 공유가 안 돼요'); }
};

/* ----- 캘린더 ----- */
const cal = { y: 0, m: 0, sel: null };
const ROOM_NAME = { reject: '결재 반려하기', shred: '업무 파쇄기', resign: '사직서 던지기' };
function openCalendar() { const d = new Date(); cal.y = d.getFullYear(); cal.m = d.getMonth(); cal.sel = dayKey(d); renderCalendar(); show('calendar'); }
function renderCalendar() {
  $('#calMonth').textContent = `${cal.y}년 ${cal.m + 1}월`;
  const first = new Date(cal.y, cal.m, 1), days = new Date(cal.y, cal.m + 1, 0).getDate(), today = dayKey();
  let html = ['일', '월', '화', '수', '목', '금', '토'].map((w) => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < first.getDay(); i++) html += '<div class="cell empty"></div>';
  const monthVals = [];
  for (let d = 1; d <= days; d++) {
    const k = `${cal.y}-${pad(cal.m + 1)}-${pad(d)}`, st = dayStats(k);
    if (st) monthVals.push({ k, d, ...st });
    html += `<button class="cell${k === today ? ' today' : ''}${k === cal.sel ? ' sel' : ''}" data-k="${k}"><span class="n">${d}</span>${st ? `<span class="b lv${levelOf(st.max)}">${st.max}%</span>` : ''}</button>`;
  }
  $('#calGrid').innerHTML = html;
  $$('#calGrid .cell[data-k]').forEach((c) => (c.onclick = () => { cal.sel = c.dataset.k; renderCalendar(); }));
  // 요약 / 선택한 날
  const sel = cal.sel && cal.sel.startsWith(`${cal.y}-${pad(cal.m + 1)}`) ? dayStats(cal.sel) : null;
  let sum = '';
  if (monthVals.length) {
    const avg = Math.round(monthVals.reduce((a, v) => a + v.max, 0) / monthVals.length);
    const worst = monthVals.reduce((a, v) => (v.max > a.max ? v : a));
    sum += `<h4>${cal.m + 1}월 요약</h4>기록한 날 <b>${monthVals.length}일</b> · 평균 <b>${avg}%</b><br>가장 힘들었던 날은 <b>${cal.m + 1}월 ${worst.d}일 (${worst.max}%)</b>이었어요.`;
  } else sum += `<h4>${cal.m + 1}월 요약</h4>이번 달은 아직 기록이 없어요.`;
  if (cal.sel && cal.sel.startsWith(`${cal.y}-${pad(cal.m + 1)}`)) {
    const [, mm, dd] = cal.sel.split('-');
    sum += `<h4 style="margin-top:14px">${+mm}월 ${+dd}일</h4>`;
    if (sel) {
      sum += `그날의 최고 스트레스 <b>${sel.max}%</b><ul>${sel.list.slice().sort((a, b) => a.ts - b.ts).map((s) => {
        const t = new Date(s.ts); return `<li><span class="t">${pad(t.getHours())}:${pad(t.getMinutes())}</span><span class="r">${ROOM_NAME[s.room] || s.room} · ${s.count}회</span><i class="dot" style="background:var(--lv${levelOf(s.stress)})"></i><b>${s.stress}%</b></li>`;
      }).join('')}</ul>`;
    } else sum += '기록이 없는 날이에요.';
  }
  $('#calSum').innerHTML = sum;
}

/* ================= 이벤트 연결 ================= */
$$('.room-card').forEach((b) => (b.onclick = () => { Sound.unlock(); Sound.key(); Track.ev('click_room', b.dataset.room); openIntro(b.dataset.room); }));

bindLogo();

Track.pageView();

window.__office = { Game, Motion, Store, ROOMS };
})();
